[package]
name = "RoCo"
version = "0.1.0"
edition = "2024"

[dependencies]
# Provides GPIO, I2C, PWM, SPI, UART, and System tools.
rppal = "0.22.1"
# Provides an async Rust runtime.
tokio = { version = "1.49.0", features = ["full"] }
# Provides async serial port abstraction.
tokio-serial = "5.4.5"
# Provides async gpio chip abstraction.
tokio-gpiod = "0.3.0"
# Provides "async" I2C abstraction. sort of. read the docs.
tokio-i2c = "0.2.0"
# Convenient derive macro for the standard library's std::error::Error.
thiserror = "2.0.17"
# Interface to the Direct Rendering Manager subsystem. 
drm = { version = "0.14.1" }
# Provides enums for every FourCC code.
drm-fourcc = "2.2.0"
# Memory mapped buffers.
memmap2 = "0.9.9"
# Bindings to the various *nix system functions. We just need `ioctl` for the display interface.
nix = { version = "0.30.1", features = ["ioctl"] }
# Rust bitflags!
bitflags = "2.10.0"
# Converting primatives to enums without boilerplate: useful for UBX binary parsing.
num_enum = "0.7.5"
# Dates and times.
chrono = "0.4"
# Font rendering.
ab_glyph = "0.2.32"
# For sending diagnostic information.
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

# Provides interactive command-line input for debug
# rustyline = "11.0.0"